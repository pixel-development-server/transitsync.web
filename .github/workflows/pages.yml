name: Deploy panel to GitHub Pages

# Serves the built React panel on GitHub Pages. The API, database and live
# stream stay on the TransitSync server; every request is sent to
# https://api.transitsync.me (set here via VITE_API_URL, consumed by
# client/src/lib/api.js and client/src/lib/stream.js).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build the panel
        working-directory: client
        env:
          VITE_API_URL: https://api.transitsync.me
        run: npm run build

      # `client/vite.config.js` emits dist/404.html as a copy of index.html so
      # GitHub Pages deep links (e.g. /students/42) boot the SPA on a hard
      # refresh instead of Pages' own 404. Guard it so a regression fails here
      # rather than silently breaking routing in production.
      - name: Verify SPA fallback was generated
        run: test -f client/dist/404.html

      - name: Add the custom-domain marker (CNAME)
        run: echo "transitsync.me" > client/dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4